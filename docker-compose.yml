# Local stack: PostgreSQL + PostGIS, MinIO (S3-compatible object storage) and the API.
#   docker compose up -d --build
#   docker compose exec api node dist/database/seed.cli.js   # optional demo data
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: troca
      POSTGRES_PASSWORD: troca
      POSTGRES_DB: troca
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U troca -d troca"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: troca
      MINIO_ROOT_PASSWORD: troca-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 troca troca-secret; do sleep 1; done;
      mc mb --ignore-existing local/troca-photos;
      mc anonymous set download local/troca-photos;
      "

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://troca:troca@db:5432/troca
      MIGRATE_ON_START: "true"
      JWT_ACCESS_SECRET: dev-only-secret-dev-only-secret-dev-only-secret
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: troca-photos
      S3_ACCESS_KEY_ID: troca
      S3_SECRET_ACCESS_KEY: troca-secret
      S3_FORCE_PATH_STYLE: "true"
      # Bucket is public-read in dev, so photos are served straight from MinIO.
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000/troca-photos
    ports: ["3000:3000"]

volumes:
  db-data:
  minio-data:
